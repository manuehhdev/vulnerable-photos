<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VulnerablePhotos — Sign in</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="warn-banner">⚠ VulnerablePhotos is an intentionally insecure lab app. Do not deploy. Local use only.</div>

<div class="auth-card">
  <h1>VulnerablePhotos</h1>
  <div id="notice"></div>

  <form id="login-form">
    <input type="text" id="username" placeholder="Username" autocomplete="username" required>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" class="btn" style="width:100%">Sign in</button>
  </form>

  <div class="switch-link">
    No account? <a href="#" id="show-register">Register</a>
    &nbsp;|&nbsp;
    Try: <code>alice / alice123</code>
  </div>

  <form id="register-form" style="display:none">
    <input type="text" id="reg-username" placeholder="Username" required>
    <input type="email" id="reg-email" placeholder="Email" required>
    <input type="password" id="reg-password" placeholder="Password" required>
    <button type="submit" class="btn" style="width:100%">Create account</button>
  </form>
</div>

<script src="js/login.js"></script>
</body>
</html>
